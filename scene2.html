<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scene 2</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="scene-2" style="background-color: #fce4ce;">
    <main id="app">
      <div class="text-section top-left" id="text1"></div>
      <div class="text-section top-right" id="text2"></div>
      <div class="text-section bottom-left" id="text3"></div>
      <div class="text-section bottom-right" id="text4"></div>
      <div class="circle-container">
        <img src="Assets/sorry.gif" alt="Sorry" />
      </div>
      <img src="Assets/dudu-waving-new-bubu-dudu-ezgif.com-crop.gif" class="scene2-dudu-gif" alt="Dudu waving" data-next="scene3.html" role="button" aria-label="Go to next screen">
    </main>

    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <script>
      const texts = [
        "I'm sorry for not understanding you",
        "I'm sorry for being so insufferable and frustrating to be with.",
        "I'm sorry for not saying things which I should have said",
        "And for saying things which I shouldn't have...."
      ];
      const elements = [
        document.getElementById('text1'),
        document.getElementById('text2'),
        document.getElementById('text3'),
        document.getElementById('text4')
      ];

      let currentTextIndex = 0;
      let currentCharIndex = 0;

      function typeWriter() {
        if (currentTextIndex < texts.length) {
          if (currentCharIndex < texts[currentTextIndex].length) {
            elements[currentTextIndex].innerHTML += texts[currentTextIndex].charAt(currentCharIndex);
            currentCharIndex++;
            setTimeout(typeWriter, 50);
          } else {
            currentTextIndex++;
            currentCharIndex = 0;
            if (currentTextIndex < texts.length) {
              setTimeout(typeWriter, 1000);
            } else {
              // Typing finished, show the gif
              const gif = document.querySelector('.scene2-dudu-gif');
              gif.style.opacity = '1';
              gif.style.pointerEvents = 'auto';
            }
          }
        }
      }

      // Start the typing animation after the circle and image fade in
      setTimeout(typeWriter, 4500);

      // Handle the transition to scene 3
      const scene2Gif = document.querySelector(".scene2-dudu-gif");
      if (scene2Gif) {
        scene2Gif.addEventListener("click", (e) => {
          const next = scene2Gif.dataset.next;
          if (next) {
            const wipe = document.createElement("div");
            wipe.className = "heart-wipe";
            wipe.style.left = `${e.clientX}px`;
            wipe.style.top = `${e.clientY}px`;
            document.body.appendChild(wipe);

            gsap.set(wipe, { xPercent: -50, yPercent: -50, scale: 0 });
            gsap.to(wipe, {
              scale: 50,
              duration: 1.2,
              ease: "power2.in",
              onComplete: () => {
                window.location.assign(next);
              }
            });
          }
        });
      }
    </script>
  </body>
</html>
